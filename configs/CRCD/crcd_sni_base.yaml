# CRCD base config for SNI-SLAM — MINIMAL.
#
# Philosophy (user 2026-06-23): run SNI-SLAM at its NATIVE config (configs/SNI-SLAM.yaml)
# and change ONLY what CRCD physically requires. Earlier this file carried many
# "match DDS-SLAM" deviations (tracking/mapping pixels, iters, iters_first, lr, keyframe
# cadence) that throttled SNI's own optimisation and produced soft/under-converged renders.
# Those are all REVERTED to base by simply not overriding them (they inherit SNI-SLAM.yaml).
#
# Per-snippet inheritors (c1_001.yaml etc.) add only: mapping.bound, marching_cubes_bound,
# data.input_folder, data.output. The runbook's Phase 3.7 additionally scales model.truncation
# by the per-snippet sc_factor at runtime (REQUIRED: base truncation 0.06 m is ~60% of CRCD's
# ~0.10 m rescaled depth -> over-thick SDF band -> over-smooth surface; scaling restores SNI's
# Replica-like truncation-to-depth ratio).
#
# What is KEPT here, and why each is REQUIRED for CRCD (not a tuning choice):
#   - cam: CRCD rectified ECM-stereo intrinsics + MoGe png_depth_scale (base is Replica's).
#   - planes_res/c_planes_res/s_planes_res/bound_dividable: base resolution targets ~10 m
#     Replica scenes; CRCD's ~0.5 m bound would be 25-46x undersampled.
#   - model.cnn.n_classes: CRCD has 4 classes (bg/Liver/Gallbladder/Tool), base has 52.
#   - mapping.lr.fusion_lr: the root SNI-SLAM.yaml lr block lacks fusion_lr (it lives only in
#     replica.yaml); Mapper.py KeyErrors without it.
#   - func.use_gt_semantic: CRCD ships GT masks AND the base Replica seg head cannot predict
#     CRCD's 4 classes, so GT seg is required for the baseline. (The predicted-DINOv3-seg run
#     flips this to False with a CRCD seg head — that's the later B experiment.)

inherit_from: configs/SNI-SLAM.yaml
dataset: 'crcd'

cam:
  H: 720
  W: 1280
  fx: 1096.6961889243337
  fy: 1096.6961889243337
  cx: 622.8076171875
  cy: 383.12598037719727
  png_depth_scale: 10000      # MoGe-2 uint16 convention (base 1000)
  crop_edge: 0

# CRCD scene scale (~0.5 m bound) — base values target ~10 m Replica scenes and
# would 25-46x undersample CRCD. These give ~20+ cells/axis (Replica-like density).
planes_res:
  coarse: 0.04
  fine: 0.005
  bound_dividable: 0.01
c_planes_res:
  coarse: 0.04
  fine: 0.003
s_planes_res:
  coarse: 0.04
  fine: 0.003

mapping:
  lr:
    fusion_lr: 3.0e-3          # REQUIRED: absent from root SNI-SLAM.yaml lr block

model:
  cnn:
    n_classes: 4               # CRCD: bg / Liver / Gallbladder / Tool (base 52)

func:
  use_gt_semantic: True        # baseline uses CRCD GT masks (base Replica head can't
                               # predict CRCD classes); B run flips to predicted DINOv3 seg
