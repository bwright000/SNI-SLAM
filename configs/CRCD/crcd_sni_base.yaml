# CRCD benchmark config for SNI-SLAM — FAITHFUL to the authors' SNI-SLAM.yaml.
#
# 🚨 2026-07-04 REVERT (4-agent audit): the ORIGINAL intent below (#4-#9, #12) borrowed DDS-SLAM's
# CRCD hyperparameters (lr_T/lr_R, tracking+mapping iters/pixels, keyframe cadence, joint_opt_cam_lr,
# use_gt_semantic=True) to make SNI "match the DDS arm". That configured SNI with DDS's settings, so
# the numbers were NOT reflective of SNI-SLAM (lr_T=1e-4 crippled const-speed damping -> tracker
# over-travel -> black renders). Those deviations are REMOVED -> SNI now inherits the authors' own
# tracking/mapping values verbatim (see the tracking/mapping block below). The ONLY overrides kept are
# genuinely dataset-necessary: intrinsics (#2), png_depth_scale (#3), n_classes (#10), scene-scaled
# truncation + tri-plane resolution, and the bound (per-snippet, from the runbook). Goal: whatever
# PSNR/ATE SNI gives is SNI's own honest result on CRCD, not a DDS-flavoured hybrid.
#
# Purpose: SNI-SLAM benchmark on the rectified 5-snippet CRCD set, judged with the same battery as
# the DDS/SGS/SemSup arms. Original build: workflow w0urnhiws (2026-06-04).
#
# Original (2026-06-04) deviation list — #4-#9 and #12 are now REVERTED per the banner above:
#
# 1. dataset = 'crcd'  (registered in src/utils/datasets.py 2026-06-03)
# 2. cam intrinsics: H=720, W=1200 → W=1280, fx=600 → 1096.6961889243337,
#    cx/cy from CRCD ECM rectified.  Source: intrinsics.yaml in
#    F:/Datasets/CRCD-Published/<EP>/snippet_<SID>/.
#    13% focal-length error in the Replica defaults — catastrophic for CRCD.
# 3. cam.png_depth_scale = 10000  (MoGe-2 convention; was 1000 in Replica).
# 4. tracking.lr_T = 0.0001  (DDS-SLAM F1 catastrophic-flaw fix per
#    project_lr_fix_breakthrough_20260429 BC0 → 39% StereoMIS ATE reduction).
#    NOTE: this is 10x SMALLER than the paper's text 0.001.  Justification:
#    CRCD sub-SNR regime (active median 0.115 mm/f vs ~1 mm tracker noise
#    floor); we operate well below SNI-SLAM's Replica regime.
# 5. tracking.iters = 10  (matches DDS-SLAM CRCD; was 8 in SNI-SLAM Replica).
# 6. tracking.pixels = 1024  (matches DDS-SLAM CRCD Q=1024; was 2000).
# 7. mapping.iters = 10  (REVERT from SNI-SLAM's 15 → matches DDS-SLAM CRCD).
# 8. mapping.iters_first = 200  (REVERT from SNI-SLAM's 1000 → matches DDS-SLAM CRCD;
#    note DDS-SLAM CRCD originally tried Recipe A iters_first=1000, demoted).
# 9. mapping.pixels = 2048  (matches DDS-SLAM CRCD Qg=Qt=2048; was 4000).
# 10. model.cnn.n_classes = 4  (CRCD has 4 classes: 0=bg, 1=Liver,
#     2=Gallbladder, 3=Tool; was 52 for Replica).  Final-conv shape mismatch
#     is silenced by strict=False in model_manager.py (already applied 3745cc2).
# 11. model.cnn.pretrained_model_path: still 'seg/dinov2_replica.pth' — the
#     pre-trained ViT backbone is loaded; only the final 52-channel conv is
#     unused under use_gt_semantic=True (verified dead code path).
# 12. func.use_gt_semantic = True  (CRCD has semantic_class ready in
#     preprocess output; matches DDS-SLAM's edge_semantic-via-masks pipeline
#     conceptually).
#
# Knobs preserved (paper-faithful, not changed):
#   - model.hidden_dim = 32, c_dim = 16  (workflow refuted "over-parametrization"
#     hypothesis — paper suppl 2.2 explicitly states these are paper-matched)
#   - tracking.const_speed_assumption = True  (per user lock 2026-06-04;
#     full F2 fix via static-frame gate deferred to code change)
#   - rendering.{n_stratified, n_importance, perturb, learnable_beta}: inherit
#   - mapping.keyframe_every = 4, mapping_window_size = 5
#
# Knobs CORRECTED 2026-06-05 (workflow w5k5n8zma audit found major issues):
#   - planes_res / c_planes_res / s_planes_res: SCALED from Replica (10m
#     scenes) to CRCD (0.21m bound).  Original inherited values gave ~0.9
#     coarse cells / 3.5 fine cells per axis on CRCD — 25-46x undersampling.
#     New values produce ~20+ cells/axis (matching Replica's effective density).
#   - bound_dividable: 0.24 (Replica) -> 0.01 (CRCD).  Must divide bound exactly.
#
# Per-snippet inheritors override only: mapping.bound, data.input_folder,
# data.output, sc_factor (written by Phase 1.6 stereo anchor calibration in
# runbook).
#
# IMPORTANT: data.sc_factor is NOT a knob SNI-SLAM honours natively
# (datasets.py uses cfg['scale'] as a global divisor).  Phase 1.6 instead
# REGENERATES the MoGe depth PNGs at the calibrated scale, so that
# png_depth_scale=10000 + sc_factor=1.0 produces the right metric depth on
# load.  Workflow lens D rec.

inherit_from: configs/SNI-SLAM.yaml
dataset: 'crcd'
scale: 1

meshing:
  level_set: 0
  resolution: 0.005    # tighter for close-up surgical scale (~25 mm scene)
  eval_rec: True
  mesh_bound_scale: 1.05

# TRACKING + MAPPING — authors' SNI-SLAM.yaml values inherited VERBATIM (faithful benchmark).
# 2026-07-04 REVERT: the 2026-06 config re-set lr_T/lr_R=1e-4, tracking iters=10/pixels=1024,
# mapping iters=10/iters_first=200/pixels=2048, keyframe_every=5, joint_opt_cam_lr=1e-4 to "match
# the DDS-SLAM arm" -- but that configured SNI with DDS's hyperparameters, so the results were NOT
# reflective of SNI-SLAM. The 4-agent audit (2026-07-04) showed lr_T=1e-4 (10x below the authors'
# 1e-3) crippled the const-speed damping -> tracker over-travel. Removed ALL of them so they inherit
# the authors' defaults (lr_T=lr_R=1e-3, tracking iters=8/pixels=2000, mapping iters=15/
# iters_first=1000/pixels=4000, every_frame=keyframe_every=4, joint_opt=True/joint_opt_cam_lr=1e-3,
# ignore_edge=75). Only genuinely dataset-necessary knobs are overridden below.
tracking:
  const_speed_assumption: True   # authors' default; also user-locked 2026-06-04 (kept explicit)

mapping:
  lr:
    fusion_lr: 3.0e-3    # replica.yaml value; base needs it or Mapper.py:323 KeyErrors (not in SNI-SLAM.yaml)

cam:
  H: 720
  W: 1280
  fx: 1096.6961889243337
  fy: 1096.6961889243337
  cx: 622.8076171875
  cy: 383.12598037719727
  png_depth_scale: 10000
  crop_edge: 0

model:
  c_dim: 16            # paper-matched (refuted "32→16" hypothesis; this stays)
  truncation: 0.01     # scene-scaled for CRCD's ~0.1m depth (authors' 0.06 is for Replica's ~10m
                       # scenes; 0.06 here spans ~85% of the 0.21m bound -> smeared SDF). The runbook
                       # re-writes this to 0.01 too; set here so bare `run.py` is also correct
                       # (2026-07-04: removed the stale 0.06 footgun flagged by the config audit).
  hidden_dim: 32       # paper-matched
  fused_hidden_dim: 16
  sem_hidden_dim: 256
  cnn:
    n_classes: 4       # CRCD: bg / Liver / Gallbladder / Tool
    pretrained_model_path: 'seg/dinov2_replica.pth'

# CRCD-scaled tri-plane resolution.  Critical fix per workflow w5k5n8zma:
# inherited Replica values (coarse=0.24m, fine=0.06m) on CRCD's 0.21m bound
# gave <1 coarse cell / 3.5 fine cells per axis — 25-46x undersampling.
# These values produce ~20+ cells per axis (matching Replica's effective
# density on its 10m scenes).
planes_res:
  coarse: 0.04
  fine: 0.005
  bound_dividable: 0.01
c_planes_res:
  coarse: 0.04
  fine: 0.003
s_planes_res:
  coarse: 0.04
  fine: 0.003

func:
  use_gt_semantic: False   # authors' default = self-supervised DINO head (the paper method).
                           # The runbook's mk_sni_cfg overrides this per GT_SEM (GT_SEM=1 -> True, the
                           # GT-mask ablation). Base is False so a bare run is the method-faithful path.
  use_gt_pose: False
