# C_1/001 — SNI-SLAM preliminary, paired with DDS-SLAM's c1_001_paperfaith_lrfix
#
# Same data, same MoGe depth (with stereo-anchor sc_factor applied at preprocess),
# same bound as DDS-SLAM CRCD config for direct comparability.

inherit_from: configs/CRCD/crcd_sni_base.yaml

mapping:
  # bound WIDENED to the GT-pose-derived extent (preprocess derive_bound, pose +/- 0.25 m).
  # The old static [...,[0.68,0.90]] was camera-centred + ~0.12 m tight, so it CLIPPED the tissue
  # surface: camera z ~0.78 m minus MoGe depth ~0.10-0.20 m -> surface ~0.58-0.68 m, at/below the
  # 0.68 floor -> the SDF forms no surface there -> the dark blobs. This extent contains pose +/-
  # depth for either OpenGL sign and is the deep-dive fix #2 (with the render-weight normalize, #1).
  bound: [[-0.23,0.28],[-0.17,0.34],[0.53,1.05]]
  marching_cubes_bound: [[-0.23,0.28],[-0.17,0.34],[0.53,1.05]]

data:
  input_folder: data/CRCD/C1_001/
  output: output/CRCD/c1_001/test
